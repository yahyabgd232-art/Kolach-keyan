<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>بوابة خدمات الاتصالات الجزائرية</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root {
      --djezzy-color: #e11d48;
      --ooredoo-color: #dc2626;
      --mobilis-color: #16a34a;
      --algerie-color: #0284c7;
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --text-color: #f8fafc;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      padding: 16px;
      min-height: 100vh;
    }

    .header {
      text-align: center;
      margin-bottom: 20px;
    }

    .header h1 {
      font-size: 20px;
      color: #38bdf8;
      margin-bottom: 6px;
    }

    .header p {
      font-size: 13px;
      color: #94a3b8;
    }

    /* شبكة اختيار المتعاملين */
    .operators-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
      margin-bottom: 20px;
    }

    .op-card {
      background: var(--card-bg);
      border-radius: 14px;
      padding: 16px;
      text-align: center;
      border: 2px solid transparent;
      cursor: pointer;
      transition: all 0.2s ease;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .op-card:active {
      transform: scale(0.96);
    }

    .op-card.active {
      border-color: #38bdf8;
      background: #26334d;
    }

    .op-badge {
      width: 45px;
      height: 45px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      font-size: 18px;
      color: #fff;
      margin-bottom: 8px;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
    }

    /* ألوان الشعارات الخاصة بالمتعاملين */
    .badge-djezzy { background: linear-gradient(135deg, #e11d48, #9f1239); }
    .badge-ooredoo { background: linear-gradient(135deg, #dc2626, #991b1b); }
    .badge-mobilis { background: linear-gradient(135deg, #16a34a, #15803d); }
    .badge-algerie { background: linear-gradient(135deg, #0284c7, #0369a1); }

    .op-card h3 {
      font-size: 15px;
      margin-bottom: 2px;
    }

    .op-card span {
      font-size: 11px;
      color: #94a3b8;
    }

    /* نموذج تسجيل الدخول */
    .login-section {
      background: var(--card-bg);
      border-radius: 16px;
      padding: 20px;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.2);
    }

    .form-group {
      margin-bottom: 14px;
    }

    .form-group label {
      display: block;
      font-size: 13px;
      margin-bottom: 6px;
      color: #cbd5e1;
    }

    .input-field {
      width: 100%;
      padding: 12px;
      border-radius: 10px;
      border: 1px solid #334155;
      background: #0f172a;
      color: #fff;
      font-size: 16px;
      text-align: center;
      outline: none;
      letter-spacing: 1px;
    }

    .input-field:focus {
      border-color: #38bdf8;
    }

    .btn {
      width: 100%;
      padding: 12px;
      border-radius: 10px;
      border: none;
      font-size: 15px;
      font-weight: bold;
      color: #fff;
      cursor: pointer;
      background: #0284c7;
      transition: background 0.2s;
    }

    .btn-success {
      background: #16a34a;
    }

    .btn:active {
      opacity: 0.9;
    }

    .step-box {
      display: none;
    }

    .step-box.active-step {
      display: block;
    }

    .status-msg {
      margin-top: 12px;
      font-size: 13px;
      text-align: center;
      color: #38bdf8;
    }
  </style>
</head>
<body>

  <div class="header">
    <h1>📱 خدمات الشحن والاتصالات</h1>
    <p>اختر المتعامل وسجل الدخول لربط الحساب</p>
  </div>

  <!-- شبكة البطاقات والشعارات -->
  <div class="operators-grid">
    <div class="op-card active" id="card-djezzy" onclick="selectOperator('djezzy', 'جيزي Djezzy', '07')">
      <div class="op-badge badge-djezzy">Dz</div>
      <h3>جيزي</h3>
      <span>Djezzy App</span>
    </div>

    <div class="op-card" id="card-ooredoo" onclick="selectOperator('ooredoo', 'أوريدو Ooredoo', '05')">
      <div class="op-badge badge-ooredoo">Oo</div>
      <h3>أوريدو</h3>
      <span>My Ooredoo</span>
    </div>

    <div class="op-card" id="card-mobilis" onclick="selectOperator('mobilis', 'موبيليس Mobilis', '06')">
      <div class="op-badge badge-mobilis">Mob</div>
      <h3>موبيليس</h3>
      <span>My Mobilis</span>
    </div>

    <div class="op-card" id="card-algerie" onclick="selectOperator('algerie', 'اتصالات الجزائر', '4G/ADSL')">
      <div class="op-badge badge-algerie">AT</div>
      <h3>إيدوم</h3>
      <span>Algérie Télécom</span>
    </div>
  </div>

  <!-- نموذج تسجيل الدخول المرحلي -->
  <div class="login-section">
    
    <!-- الخطوة الأولى: إدخال الرقم -->
    <div id="step1" class="step-box active-step">
      <div class="form-group">
        <label id="phoneLabel">رقم الهاتف (جيزي):</label>
        <input type="tel" id="phoneNumber" class="input-field" placeholder="07XXXXXXXX" maxlength="10" />
      </div>
      <button class="btn" onclick="requestOTP()">إرسال رمز التأكيد (SMS)</button>
    </div>

    <!-- الخطوة الثانية: إدخال رمز SMS -->
    <div id="step2" class="step-box">
      <div class="form-group">
        <label>أدخل رمز التأكيد المرسل إلى هاتفك:</label>
        <input type="number" id="otpCode" class="input-field" placeholder="XXXX" maxlength="6" />
      </div>
      <button class="btn btn-success" onclick="verifyOTP()">تأكيد وتسجيل الدخول</button>
    </div>

    <div id="statusMessage" class="status-msg"></div>
  </div>

  <script>
    const tg = window.Telegram.WebApp;
    tg.expand();

    let currentOperator = 'djezzy';

    function selectOperator(op, name, prefix) {
      currentOperator = op;
      
      // تحديث تمييز البطاقة المحددة
      document.querySelectorAll('.op-card').forEach(c => c.classList.remove('active'));
      document.getElementById('card-' + op).classList.add('active');

      // تحديث العنوان ونوع الرقم
      document.getElementById('phoneLabel').innerText = `رقم الحساب (${name}):`;
      document.getElementById('phoneNumber').placeholder = prefix.startsWith('0') ? `${prefix}XXXXXXXX` : 'رقم الحساب / الهاتف';
      
      // العودة للخطوة الأولى عند تغيير المتعامل
      showStep(1);
      document.getElementById('statusMessage').innerText = '';
    }

    function showStep(stepNumber) {
      document.getElementById('step1').classList.remove('active-step');
      document.getElementById('step2').classList.remove('active-step');
      document.getElementById(`step${stepNumber}`).classList.add('active-step');
    }

    function requestOTP() {
      const phone = document.getElementById('phoneNumber').value;
      
      if (phone.length < 8) {
        alert('يرجى إدخال رقم هاتف صحيح');
        return;
      }

      document.getElementById('statusMessage').innerText = 'جاري طلب رمز SMS من المتعامل...';

      // محاكاة إرسال الرمز والانتقال للخطوة التالية
      setTimeout(() => {
        showStep(2);
        document.getElementById('statusMessage').innerText = `تم إرسال الرمز إلى الرقم ${phone}`;
      }, 1000);
    }

    function verifyOTP() {
      const otp = document.getElementById('otpCode').value;

      if (!otp || otp.length < 4) {
        alert('يرجى إدخال رمز التأكيد الصحيح');
        return;
      }

      document.getElementById('statusMessage').innerText = 'جاري التحقق من الرمز...';

      // محاكاة تأكيد الدخول
      setTimeout(() => {
        document.getElementById('statusMessage').innerText = '🎉 تم تسجيل الدخول بنجاح! الحساب مرتبط الآن.';
      }, 1000);
    }
  </script>
</body>
</html>
