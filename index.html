<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Goold & Lark Player</title>
    <style>
        body {
            background-color: #121212;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
            padding-bottom: 80px;
        }
        /* شريط العنوان العلوي */
        .top-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 15px;
            background: #181818;
            border-bottom: 1px solid #222;
        }
        .app-brand {
            display: flex;
            align-items: center;
            gap: 8px;
            font-weight: bold;
            color: #f39c12;
            font-size: 16px;
        }
        .app-brand span {
            color: #00d2ff;
        }
        .header-icons {
            display: flex;
            gap: 15px;
            color: #aaa;
            font-size: 16px;
        }
        /* القائمة العلوية */
        .tabs-nav {
            display: flex;
            gap: 20px;
            padding: 10px 15px;
            background: #181818;
            overflow-x: auto;
            border-bottom: 1px solid #282828;
            white-space: nowrap;
        }
        .tab-item {
            color: #777;
            font-size: 14px;
            cursor: pointer;
        }
        .tab-item.active {
            color: #00d2ff;
            font-weight: bold;
            border-bottom: 2px solid #00d2ff;
            padding-bottom: 3px;
        }
        .container {
            padding: 15px;
            max-width: 480px;
            margin: 0 auto;
        }
        /* قائمة الأغاني */
        .song-card {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: #1e1e1e;
            padding: 10px;
            border-radius: 8px;
            margin-bottom: 8px;
        }
        .song-info-group {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .song-thumb {
            width: 45px;
            height: 45px;
            border-radius: 6px;
            background: #2a2a2a;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #888;
            font-size: 14px;
            object-fit: cover;
        }
        .song-titles h4 {
            margin: 0 0 3px 0;
            font-size: 14px;
            color: #fff;
        }
        .song-titles p {
            margin: 0;
            font-size: 11px;
            color: #aaa;
        }
        /* استوديو التصميم المدمج */
        .studio-box {
            background: #1a1a1a;
            border: 1px solid #333;
            border-radius: 12px;
            padding: 15px;
            margin-top: 20px;
        }
        .studio-box h3 {
            color: #f39c12;
            text-align: center;
            font-size: 17px;
            margin-top: 0;
            margin-bottom: 15px;
        }
        .form-group {
            margin-bottom: 12px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-size: 12px;
            color: #ccc;
        }
        input[type="file"], select, input[type="text"] {
            width: 100%;
            padding: 10px;
            background: #252525;
            border: 1px solid #444;
            border-radius: 6px;
            color: #fff;
            box-sizing: border-box;
            font-size: 13px;
        }
        .preview-area {
            width: 100%;
            height: 180px;
            background: #121212;
            border: 2px dashed #444;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            margin-bottom: 12px;
        }
        .preview-area img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .btn-go {
            width: 100%;
            background: #f39c12;
            color: #121212;
            border: none;
            padding: 12px;
            border-radius: 6px;
            font-weight: bold;
            font-size: 15px;
            cursor: pointer;
        }
        /* مشغل الموسيقى السفلي */
        .bottom-player {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            background: #1b1622;
            border-top: 1px solid #2d2438;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 10px 15px;
            box-sizing: border-box;
        }
        .player-left {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .player-icon {
            width: 38px;
            height: 38px;
            background: #3c324a;
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
        }
        .player-title {
            font-size: 13px;
            font-weight: bold;
            color: #fff;
        }
        .player-controls {
            display: flex;
            align-items: center;
            gap: 15px;
            color: #fff;
        }
        .play-circle {
            width: 32px;
            height: 32px;
            background: #fff;
            color: #000;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
        }
    </style>
</head>
<body>

    <!-- الشريط العلوي -->
    <div class="top-header">
        <div class="app-brand">
            <span>🔵</span> Goold 🔶 Lark
        </div>
        <div class="header-icons">
            <span>🔍</span>
            <span>📑</span>
            <span>⚙️</span>
        </div>
    </div>

    <!-- التبويبات -->
    <div class="tabs-nav">
        <div class="tab-item">Vidéos</div>
        <div class="tab-item active">Chansons</div>
        <div class="tab-item">Playlists</div>
        <div class="tab-item">Dossiers</div>
        <div class="tab-item">Artists</div>
    </div>

    <div class="container">
        
        <!-- قائمة مصغرة للأغاني -->
        <div class="song-card">
            <div class="song-info-group">
                <div class="song-thumb">🎵</div>
                <div class="song-titles">
                    <h4>roses_in_the_snow</h4>
                    <p>Music</p>
                </div>
            </div>
            <span style="color:#666;">⋮</span>
        </div>

        <!-- استوديو التصميم المدمج -->
        <div class="studio-box">
            <h3>استوديو تصميم الأغاني 🔶</h3>

            <div class="form-group">
                <label>اختر صورة من الهاتف (لاستخراج الوجه):</label>
                <input type="file" id="imageInput" accept="image/*">
            </div>

            <div class="preview-area" id="previewContainer">
                <span style="color: #666; font-size: 12px;">معاينة الوجه والفلاتر</span>
            </div>

            <div class="form-group">
                <label>اختر فلتر الصورة:</label>
                <select id="filterSelect">
                    <option value="normal">عادي (Normal)</option>
                    <option value="dark">فلتر مظلم ليلي</option>
                    <option value="cinematic">سينمائي</option>
                </select>
            </div>

            <div class="form-group">
                <label>اكتب عبارة على المقطع:</label>
                <input type="text" id="captionInput" placeholder="اكتب النص هنا...">
            </div>

            <div class="form-group">
                <label>اختر مقطع الأغنية الحالي:</label>
                <select id="songPart">
                    <option value="part1">مقطع الأغنية (roses_in_the_snow)</option>
                    <option value="chorus">المقطع الحماسي (Chorus)</option>
                </select>
            </div>

            <button class="btn-go" id="downloadBtn">📥 تحميل المقطع النهائي</button>
        </div>

    </div>

    <!-- شريط التشغيل السفلي -->
    <div class="bottom-player">
        <div class="player-left">
            <div class="player-icon">🎵</div>
            <div class="player-title">roses_in_the_snow</div>
        </div>
        <div class="player-controls">
            <span>🔄</span>
            <div class="play-circle">▶</div>
        </div>
    </div>

    <script>
        // معاينة الصورة مباشرة
        const imageInput = document.getElementById('imageInput');
        const previewContainer = document.getElementById('previewContainer');

        imageInput.addEventListener('change', function(event) {
            const file = event.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    previewContainer.innerHTML = `<img src="${e.target.result}" alt="Preview">`;
                }
                reader.readAsDataURL(file);
            }
        });

        document.getElementById('downloadBtn').addEventListener('click', function() {
            alert('تم تجهيز وتحميل المقطع النهائي بنجاح!');
        });
    </script>

</body>
</html>
