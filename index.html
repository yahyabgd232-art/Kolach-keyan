<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>خدمات الاتصالات الجزائرية</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }

    body {
      background-color: var(--tg-theme-bg-color, #0f172a);
      color: var(--tg-theme-text-color, #ffffff);
      padding: 16px;
      min-height: 100vh;
    }

    .header {
      text-align: center;
      margin-bottom: 20px;
    }

    .header h1 {
      font-size: 20px;
      color: var(--tg-theme-button-color, #38bdf8);
      margin-bottom: 4px;
    }

    .header p {
      font-size: 13px;
      color: var(--tg-theme-hint-color, #94a3b8);
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
      margin-bottom: 20px;
    }

    .card {
      background: var(--tg-theme-secondary-bg-color, #1e293b);
      border-radius: 12px;
      padding: 16px;
      text-align: center;
      border: 1px solid rgba(255, 255, 255, 0.05);
      cursor: pointer;
      transition: transform 0.1s;
    }

    .card:active {
      transform: scale(0.98);
    }

    .card.djezzy { border-top: 4px solid #e11d48; }
    .card.ooredoo { border-top: 4px solid #ef4444; }
    .card.mobilis { border-top: 4px solid #22c55e; }
    .card.algerie { border-top: 4px solid #0284c7; }

    .card h3 {
      font-size: 16px;
      margin-bottom: 4px;
    }

    .card p {
      font-size: 11px;
      color: var(--tg-theme-hint-color, #94a3b8);
    }

    .section {
      background: var(--tg-theme-secondary-bg-color, #1e293b);
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 16px;
    }

    .section h2 {
      font-size: 15px;
      margin-bottom: 12px;
      color: var(--tg-theme-button-color, #38bdf8);
    }

    .btn {
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 8px;
      background: var(--tg-theme-button-color, #0284c7);
      color: var(--tg-theme-button-text-color, #ffffff);
      font-weight: bold;
      font-size: 14px;
      cursor: pointer;
    }

    .code-box {
      background: rgba(0, 0, 0, 0.3);
      padding: 10px;
      border-radius: 6px;
      font-family: monospace;
      font-size: 14px;
      text-align: center;
      margin-top: 8px;
      letter-spacing: 1px;
    }
  </style>
</head>
<body>

  <div class="header">
    <h1>📱 دليل خدمات الاتصالات</h1>
    <p>اختر المتعامل للاستفادة من الخدمات والأكواد السريعة</p>
  </div>

  <div class="grid">
    <div class="card djezzy" onclick="showCodes('جيزي', '*707# (العروض) | *710# (الرصيد)')">
      <h3>جيزي</h3>
      <p>Djezzy</p>
    </div>
    <div class="card ooredoo" onclick="showCodes('أوريدو', '*151# (العروض) | *200# (الرصيد)')">
      <h3>أوريدو</h3>
      <p>Ooredoo</p>
    </div>
    <div class="card mobilis" onclick="showCodes('موبيليس', '*600# (العروض) | *222# (الرصيد)')">
      <h3>موبيليس</h3>
      <p>Mobilis</p>
    </div>
    <div class="card algerie" onclick="showCodes('اتصالات الجزائر', 'تعبئة Idoom 4G و ADSL')">
      <h3>إيدوم</h3>
      <p>Algérie Télécom</p>
    </div>
  </div>

  <div class="section" id="detailsSection" style="display: none;">
    <h2 id="operatorName">المتعامل</h2>
    <p style="font-size: 13px;">الأكواد السريعة:</p>
    <div class="code-box" id="codeDisplay">-</div>
  </div>

  <script>
    const tg = window.Telegram.WebApp;
    tg.expand();

    function showCodes(name, codes) {
      document.getElementById('detailsSection').style.display = 'block';
      document.getElementById('operatorName').innerText = name;
      document.getElementById('codeDisplay').innerText = codes;
    }
  </script>
</body>
</html>
