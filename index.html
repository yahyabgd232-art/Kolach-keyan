<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لعبة السيارات الاحترافية</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #0f172a;
            font-family: system-ui, -apple-system, sans-serif;
            user-select: none;
        }
        #ui {
            position: absolute;
            top: 20px;
            right: 20px;
            color: #f8fafc;
            font-size: 20px;
            background: rgba(30, 41, 59, 0.8);
            padding: 10px 20px;
            border-radius: 8px;
            border: 1px solid #38bdf8;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }
        #controls {
            position: absolute;
            bottom: 20px;
            width: 100%;
            text-align: center;
            color: #94a3b8;
            font-size: 14px;
        }
    </style>
    <!-- استدعاء مكتبة Three.js ثلاثية الأبعاد -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

    <div id="ui">النقاط: <span id="score">0</span></div>
    <div id="controls">استخدم أسهم لوحة المفاتيح (أو A و D) لتوجيه السيارة، و W و S للتحرك</div>

    <script>
        // إعداد المشهد، الكاميرا، والمحرك الرسومي
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x0f172a);
        scene.fog = new THREE.Fog(0x0f172a, 20, 100);

        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        // الإضاءة
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.7);
        scene.add(ambientLight);

        const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
        dirLight.position.set(10, 20, 10);
        scene.add(dirLight);

        // إنشاء الطريق
        const roadGeo = new THREE.PlaneGeometry(15, 1000);
        const roadMat = new THREE.MeshStandardMaterial({ color: 0x1e293b, roughness: 0.8 });
        const road = new THREE.Mesh(roadGeo, roadMat);
        road.rotation.x = -Math.PI / 2;
        road.position.z = -400;
        scene.add(road);

        // بناء السيارة (تصميم مبدئي احترافي)
        const carGroup = new THREE.Group();

        const bodyGeo = new THREE.BoxGeometry(1.6, 0.6, 3.5);
        const bodyMat = new THREE.MeshStandardMaterial({ color: 0xef4444, metalness: 0.5, roughness: 0.2 });
        const body = new THREE.Mesh(bodyGeo, bodyMat);
        body.position.y = 0.5;
        carGroup.add(body);

        const cabinGeo = new THREE.BoxGeometry(1.3, 0.5, 1.8);
        const cabinMat = new THREE.MeshStandardMaterial({ color: 0x38bdf8, roughness: 0.1 });
        const cabin = new THREE.Mesh(cabinGeo, cabinMat);
        cabin.position.set(0, 1.0, -0.2);
        carGroup.add(cabin);

        // العجلات
        const wheelGeo = new THREE.CylinderGeometry(0.4, 0.4, 0.4, 16);
        const wheelMat = new THREE.MeshStandardMaterial({ color: 0x111827 });
        
        const wheelPositions = [
            [-0.9, 0.4, 1.2], [0.9, 0.4, 1.2],
            [-0.9, 0.4, -1.2], [0.9, 0.4, -1.2]
        ];

        wheelPositions.forEach(pos => {
            const wheel = new THREE.Mesh(wheelGeo, wheelMat);
            wheel.rotation.z = Math.PI / 2;
            wheel.position.set(...pos);
            carGroup.add(wheel);
        });

        scene.add(carGroup);
        carGroup.position.set(0, 0, 0);

        // متغيرات الحركة والتحكم
        const keys = { ArrowLeft: false, ArrowRight: false, ArrowUp: false, ArrowDown: false, KeyA: false, KeyD: false, KeyW: false, KeyS: false };
        let carSpeed = 0;
        let score = 0;

        window.addEventListener('keydown', (e) => { if (keys.hasOwnProperty(e.code)) keys[e.code] = true; });
        window.addEventListener('keyup', (e) => { if (keys.hasOwnProperty(e.code)) keys[e.code] = false; });

        // حلقة التحديث والرسم (Animation Loop)
        function animate() {
            requestAnimationFrame(animate);

            // التحكم في السرعة
            if (keys.ArrowUp || keys.KeyW) carSpeed = 0.4;
            else if (keys.ArrowDown || keys.KeyS) carSpeed = -0.2;
            else carSpeed *= 0.92; // احتكاك التوقف

            // التوجيه يميناً ويساراً
            if ((keys.ArrowLeft || keys.KeyA) && carGroup.position.x > -6) {
                carGroup.position.x -= 0.2;
                carGroup.rotation.y = 0.3;
            } else if ((keys.ArrowRight || keys.KeyD) && carGroup.position.x < 6) {
                carGroup.position.x += 0.2;
                carGroup.rotation.y = -0.3;
            } else {
                carGroup.rotation.y *= 0.8;
            }

            // تحريك المضمار لإعطاء إيحاء بالحركة المستمرة
            road.position.z += carSpeed;
            if (road.position.z > 0) road.position.z = -400;

            if (carSpeed > 0.05) {
                score += Math.round(carSpeed * 10);
                document.getElementById('score').innerText = score;
            }

            // تتبع الكاميرا للسيارة
            camera.position.x = carGroup.position.x * 0.5;
            camera.position.y = carGroup.position.y + 4;
            camera.position.z = carGroup.position.z + 8;
            camera.lookAt(carGroup.position.x, carGroup.position.y + 1, carGroup.position.z - 2);

            renderer.render(scene, camera);
        }

        animate();

        // التوافق مع تغيير حجم الشاشة
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
