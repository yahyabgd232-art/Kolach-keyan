<!DOCTYPE html>
<html lang="ar" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lark Player Clone</title>
    <style>
        body {
            background-color: #121212;
            color: #ffffff;
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
        }
        /* شريط العنوان والأيقونات العلوي */
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 20px;
            background-color: #121212;
        }
        .app-title {
            display: flex;
            align-items: center;
            font-size: 20px;
            font-weight: bold;
            color: #ffffff;
        }
        .app-title span {
            color: #00d2ff;
            margin-right: 8px;
        }
        .top-icons {
            display: flex;
            gap: 20px;
            color: #b0b0b0;
            font-size: 18px;
        }
        /* القائمة العلوية (Tabs) */
        .tabs-container {
            display: flex;
            gap: 15px;
            padding: 0 15px 15px 15px;
            overflow-x: auto;
            border-bottom: 1px solid #222;
            white-space: nowrap;
        }
        .tab {
            color: #888;
            font-size: 15px;
            cursor: pointer;
            padding-bottom: 5px;
        }
        .tab.active {
            color: #00d2ff;
            font-weight: bold;
            border-bottom: 2px solid #00d2ff;
        }
        /* قائمة الأغاني */
        .song-list {
            padding: 10px 15px;
            margin-bottom: 70px;
        }
        .song-card {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 10px 0;
            border-bottom: 1px solid #1a1a1a;
        }
        .song-left {
            display: flex;
            align-items: center;
            gap: 15px;
        }
        .song-img {
            width: 50px;
            height: 50px;
            border-radius: 8px;
            object-fit: cover;
            background-color: #2a2a2a;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #666;
            font-size: 12px;
        }
        .song-details h4 {
            margin: 0 0 4px 0;
            font-size: 15px;
            color: #fff;
        }
        .song-details p {
            margin: 0;
            font-size: 12px;
            color: #888;
        }
        .song-menu {
            color: #666;
            font-size: 20px;
        }
        /* شريط التشغيل السفلي (Mini Player) */
        .bottom-player {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            background-color: #1e1924;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 10px 15px;
            box-sizing: border-box;
            border-top: 1px solid #2a2235;
        }
        .player-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .player-icon-box {
            width: 40px;
            height: 40px;
            background: #3c324a;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
        }
        .player-song-name {
            font-size: 14px;
            font-weight: bold;
            color: #fff;
        }
        .player-controls {
            display: flex;
            align-items: center;
            gap: 20px;
            color: #fff;
            font-size: 18px;
            padding-right: 15px;
        }
        .play-btn-circle {
            width: 35px;
            height: 35px;
            background: #fff;
            color: #121212;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
        }
    </style>
</head>
<body>

    <!-- الشريط العلوي -->
    <div class="top-bar">
        <div class="app-title">
            <span>🔵</span> Lark Player
        </div>
        <div class="top-icons">
            <span>🔍</span>
            <span>📑</span>
            <span>⚙️</span>
        </div>
    </div>

    <!-- الأقسام (Tabs) -->
    <div class="tabs-container">
        <div class="tab">Vidéos</div>
        <div class="tab active">Chansons</div>
        <div class="tab">Playlists</div>
        <div class="tab">Dossiers</div>
        <div class="tab">Artists</div>
    </div>

    <!-- قائمة الأغاني -->
    <div class="song-list">
        <!-- العنصر الأول -->
        <div class="song-card">
            <div class="song-left">
                <div class="song-img"><img src="https://via.placeholder.com/50" style="width:100%; height:100%; border-radius:8px;" alt=""></div>
                <div class="song-details">
                    <h4>Hamassat</h4>
                    <p>Didine Canon 16, Dalia - Hamassat</p>
                </div>
            </div>
            <div class="song-menu">⋮</div>
        </div>

        <!-- العنصر الثاني -->
        <div class="song-card">
            <div class="song-left">
                <div class="song-img">🎵</div>
                <div class="song-details">
                    <h4>roses_in_the_snow</h4>
                    <p>Music</p>
                </div>
            </div>
            <div class="song-menu">⋮</div>
        </div>

        <!-- العنصر الثالث -->
        <div class="song-card">
            <div class="song-left">
                <div class="song-img">🎵</div>
                <div class="song-details">
                    <h4>the_weight_of_shadows</h4>
                    <p>Music</p>
                </div>
            </div>
            <div class="song-menu">⋮</div>
        </div>

        <!-- العنصر الرابع -->
        <div class="song-card">
            <div class="song-left">
                <div class="song-img"><img src="https://via.placeholder.com/50" style="width:100%; height:100%; border-radius:8px;" alt=""></div>
                <div class="song-details">
                    <h4>WLAD 3ATI9A</h4>
                    <p>Paroles - Gnawi - WLAD 3ATI9A</p>
                </div>
            </div>
            <div class="song-menu">⋮</div>
        </div>

        <!-- العنصر الخامس -->
        <div class="song-card">
            <div class="song-left">
                <div class="song-img"><img src="https://via.placeholder.com/50" style="width:100%; height:100%; border-radius:8px;" alt=""></div>
                <div class="song-details">
                    <h4>Toxic</h4>
                    <p>Paroles - Raja Meziane - Toxic</p>
                </div>
            </div>
            <div class="song-menu">⋮</div>
        </div>
    </div>

    <!-- مشغل الصوت السفلي -->
    <div class="bottom-player">
        <div class="player-left">
            <div class="player-icon-box">🎵</div>
            <div class="player-song-name">roses_in_the_snow</div>
        </div>
        <div class="player-controls">
            <span>🔄</span>
            <div class="play-btn-circle">▶</div>
        </div>
    </div>

</body>
</html>
