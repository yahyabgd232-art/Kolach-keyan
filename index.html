<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>محرر الصور والموسيقى</title>
    <style>
        :root {
            --primary-color: #f39c12;
            --bg-color: #121212;
            --card-bg: #1e1e1e;
            --text-color: #ffffff;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .container {
            width: 100%;
            max-width: 400px;
            background: var(--card-bg);
            padding: 20px;
            border-radius: 16px;
            box-shadow: 0 8px 16px rgba(0,0,0,0.5);
            box-sizing: border-box;
        }
        h2 {
            text-align: center;
            color: var(--primary-color);
            font-size: 20px;
            margin-bottom: 20px;
        }
        .control-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-size: 14px;
            color: #ccc;
        }
        input[type="file"], input[type="text"], select {
            width: 100%;
            padding: 10px;
            border-radius: 8px;
            border: 1px solid #444;
            background: #2a2a2a;
            color: #fff;
            box-sizing: border-box;
            font-size: 14px;
        }
        .preview-container {
            position: relative;
            width: 100%;
            height: 250px;
            background: #000;
            border-radius: 10px;
            overflow: hidden;
            margin-bottom: 15px;
            display: flex;
            justify-content: center;
            align-items: center;
            border: 2px dashed #444;
        }
        #imagePreview {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: none;
        }
        .placeholder-text {
            color: #777;
            font-size: 14px;
        }
        /* الفلاتر */
        .filter-normal { filter: none; }
        .filter-grayscale { filter: grayscale(100%); }
        .filter-sepia { filter: sepia(100%); }
        .filter-brightness { filter: brightness(130%); }

        .overlay-text {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            color: #fff;
            font-weight: bold;
            font-size: 18px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
            text-align: center;
            width: 90%;
            pointer-events: none;
        }
        button {
            width: 100%;
            padding: 12px;
            background-color: var(--primary-color);
            color: #000;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
            transition: 0.3s;
        }
        button:hover {
            background-color: #d68910;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>استديو تصميم الأغاني</h2>

        <!-- اختيار الصورة من التليفون -->
        <div class="control-group">
            <label>اختر صورة من الهاتف:</label>
            <input type="file" id="imageUpload" accept="image/*">
        </div>

        <!-- معاينة الصورة مع الفلتر والنص -->
        <div class="preview-container" id="previewBox">
            <span class="placeholder-text" id="placeholderText">الصورة ستظهر هنا</span>
            <img id="imagePreview" alt="معاينة الصورة">
            <div id="textOverlayDisplay" class="overlay-text"></div>
        </div>

        <!-- اختيار الفلتر -->
        <div class="control-group">
            <label>اختر فلتر الصورة:</label>
            <select id="filterSelect">
                <option value="filter-normal">عادي (Normal)</option>
                <option value="filter-grayscale">أبيض وأسود (Grayscale)</option>
                <option value="filter-sepia">عتيق (Sepia)</option>
                <option value="filter-brightness">إضاءة عالية (Bright)</option>
            </select>
        </div>

        <!-- كتابة نص على الصورة/المقطع -->
        <div class="control-group">
            <label>اكتب عبارة على المقطع:</label>
            <input type="text" id="userInputText" placeholder="اكتب شيئاً جميلاً...">
        </div>

        <!-- اختيار مقطع الأغنية -->
        <div class="control-group">
            <label>اختر مقطع الأغنية:</label>
            <select id="audioSegment">
                <option value="intro">المقطع الأول (الداخلي)</option>
                <option value="chorus">المقطع الحماسي (الريتون / الكورال)</option>
                <option value="outro">النهاية (الخاتمة)</option>
            </select>
        </div>

        <!-- زر التحميل -->
        <button id="downloadBtn">تحميل المقطع النهائي 📥</button>
    </div>

    <script>
        const imageUpload =document.getElementById('imageUpload');
        const imagePreview = document.getElementById('imagePreview');
        const placeholderText = document.getElementById('placeholderText');
        const filterSelect = document.getElementById('filterSelect');
        const userInputText = document.getElementById('userInputText');
        const textOverlayDisplay = document.getElementById('textOverlayDisplay');
        const downloadBtn = document.getElementById('downloadBtn');

        // رفع وعرض الصورة
        imageUpload.addEventListener('change', function(event) {
            const file = event.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    imagePreview.src = e.target.result;
                    imagePreview.style.display = 'block';
                    placeholderText.style.display = 'none';
                }
                reader.readAsDataURL(file);
            }
        });

        // تطبيق الفلتر لحظياً
        filterSelect.addEventListener('change', function() {
            imagePreview.className = ''; // مسح الفلاتر القديمة
            imagePreview.classList.add(this.value);
        });

        // كتابة النص لحظياً على المعاينة
        userInputText.addEventListener('input', function() {
            textOverlayDisplay.textContent = this.value;
        });

        // محاكاة زر التحميل
        downloadBtn.addEventListener('click', function() {
            if(!imagePreview.src || placeholderText.style.display !== 'none') {
                alert('الرجاء اختيار صورة أولاً!');
                return;
            }
            alert('تم تجهيز طلبك بنجاح! سيتم حفظ المقطع والصورة على هاتفك.');
            // هنا يمكنك ربط وظيفة التصدير (Canvas Export أو خادم البايثون الخاص بك)
        });
    </script>
</body>
</html>
