<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>لعبة تخمين الرقم</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
    }

    body {
      background-color: var(--tg-theme-bg-color, #17212b);
      color: var(--tg-theme-text-color, #ffffff);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .container {
      background-color: var(--tg-theme-secondary-bg-color, #232e3c);
      border-radius: 16px;
      padding: 24px;
      width: 100%;
      max-width: 380px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.2);
      text-align: center;
    }

    h1 {
      font-size: 22px;
      margin-bottom: 8px;
      color: var(--tg-theme-button-color, #2ea6ff);
    }

    p.subtitle {
      font-size: 14px;
      color: var(--tg-theme-hint-color, #7f91a4);
      margin-bottom: 20px;
    }

    .input-group {
      margin-bottom: 16px;
    }

    input[type="number"] {
      width: 100%;
      padding: 12px 16px;
      border-radius: 10px;
      border: 2px solid var(--tg-theme-hint-color, #3d4e61);
      background-color: var(--tg-theme-bg-color, #17212b);
      color: var(--tg-theme-text-color, #ffffff);
      font-size: 18px;
      text-align: center;
      outline: none;
      transition: border-color 0.2s;
    }

    input[type="number"]:focus {
      border-color: var(--tg-theme-button-color, #2ea6ff);
    }

    button {
      width: 100%;
      padding: 12px;
      border-radius: 10px;
      border: none;
      background-color: var(--tg-theme-button-color, #2ea6ff);
      color: var(--tg-theme-button-text-color, #ffffff);
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      transition: opacity 0.2s;
    }

    button:active {
      opacity: 0.8;
    }

    .message {
      margin-top: 16px;
      padding: 12px;
      border-radius: 8px;
      font-size: 15px;
      font-weight: 500;
      min-height: 44px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .info { background-color: rgba(46, 166, 255, 0.15); color: #2ea6ff; }
    .success { background-color: rgba(46, 204, 113, 0.15); color: #2ecc71; }
    .warning { background-color: rgba(241, 196, 15, 0.15); color: #f1c40f; }
    .danger { background-color: rgba(231, 76, 60, 0.15); color: #e74c3c; }

    .stats {
      margin-top: 16px;
      font-size: 13px;
      color: var(--tg-theme-hint-color, #7f91a4);
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>🎯 لعبة تخمين الرقم</h1>
    <p class="subtitle">اخترت رقماً سرّياً بين 1 و 100، حاول تخمينه!</p>

    <div class="input-group">
      <input type="number" id="guessInput" min="1" max="100" placeholder="أدخل رقمك هنا..." />
    </div>

    <button id="submitBtn" onclick="checkGuess()">تخمين</button>

    <div id="resultMessage" class="message info">حظاً موفقاً! ابدأ بالتخمين.</div>
    <div id="attemptsCount" class="stats">عدد المحاولات: 0</div>
  </div>

  <script>
    const tg = window.Telegram.WebApp;
    tg.expand(); // توسيع النافذة لتملأ الشاشة في تليغرام

    let secret_number = Math.floor(Math.random() * 100) + 1;
    let attempts = 0;
    let gameOver = false;

    function checkGuess() {
      const input = document.getElementById('guessInput');
      const messageDiv = document.getElementById('resultMessage');
      const statsDiv = document.getElementById('attemptsCount');
      const submitBtn = document.getElementById('submitBtn');

      if (gameOver) {
        // إعادة تشغيل اللعبة
        secret_number = Math.floor(Math.random() * 100) + 1;
        attempts = 0;
        gameOver = false;
        input.value = '';
        input.disabled = false;
        submitBtn.innerText = 'تخمين';
        messageDiv.className = 'message info';
        messageDiv.innerText = 'تم بدء لعبة جديدة! أدخل رقمك.';
        statsDiv.innerText = 'عدد المحاولات: 0';
        return;
      }

      const guess = parseInt(input.value);

      if (isNaN(guess) || guess < 1 || guess > 100) {
        messageDiv.className = 'message danger';
        messageDiv.innerText = '⚠️ يرجى إدخال رقم صحيح بين 1 و 100!';
        return;
      }

      attempts++;
      statsDiv.innerText = `عدد المحاولات: ${attempts}`;

      if (guess < secret_number) {
        messageDiv.className = 'message warning';
        messageDiv.innerText = '📈 الرقم السري أكبر من هذا!';
      } else if (guess > secret_number) {
        messageDiv.className = 'message warning';
        messageDiv.innerText = '📉 الرقم السري أصغر من هذا!';
      } else {
        messageDiv.className = 'message success';
        messageDiv.innerText = `🎉 مبروك! الإجابة صحيحة (${secret_number}) في ${attempts} محاولات!`;
        input.disabled = true;
        submitBtn.innerText = 'إعادة اللعب 🔄';
        gameOver = true;
      }

      input.value = '';
      input.focus();
    }

    // إمكانية الضغط على زر Enter لتخمين الرقم
    document.getElementById('guessInput').addEventListener('keypress', function (e) {
      if (e.key === 'Enter') {
        checkGuess();
      }
    });
  </script>
</body>
</html>
